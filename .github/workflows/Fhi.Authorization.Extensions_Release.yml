name: Release Fhi.Authorization.Extensions

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in format X.Y.Z and for prerelease X.Y.Z-alphaN, X.Y.Z-betaN'
        required: true
        default: '0.0.0'
        type: string
      prerelease:
        description: 'Create a prerelease?'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release-authorization-extensions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Set version and tag variables
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "VERSION=$INPUT_VERSION" >> $GITHUB_ENV
          echo "TAG=authorization-$INPUT_VERSION" >> $GITHUB_ENV

      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ env.TAG }}
          git push origin ${{ env.TAG }}

      - name: Pack Fhi.Authorization.Extensions NuGet package
        run: |
          dotnet pack ./src/Fhi.Authorization.Extensions/Fhi.Authorization.Extensions.csproj \
            --configuration Release \
            -p:PackageVersion=${{ env.VERSION }} \
            --output nuget-packages

      - name: Login to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: TuvaK

      - name: Publish Fhi.Authorization.Extensions NuGet package
        run: |
          dotnet nuget push ./nuget-packages/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Upload Fhi.Authorization.Extensions NuGet Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nuget-packages/*.nupkg
          retention-days: 7

      - name: Create GitHub draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release Fhi.Authorization.Extensions ${{ env.VERSION }}
          draft: true
          prerelease: ${{ github.event.inputs.prerelease }}
          files: nuget-packages/*.nupkg
          body: |
            **NuGet Package**: [Fhi.Authorization.Extensions](https://www.nuget.org/packages/Fhi.Authorization.Extensions/${{ env.VERSION }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}